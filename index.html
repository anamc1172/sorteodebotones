<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elige tu destino</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ocean">
        <div class="ship ship1">🏴‍☠️⛵</div>
        <div class="ship ship2">🏴‍☠️⛵</div>
        <div class="ship ship3">🏴‍☠️🚢</div>
    </div>
    <div class="container">
        <h1>Elige tu destino</h1>
        <div id="game-area">
            <button id="red-btn" class="choice-btn red">Rojo</button>
            <button id="blue-btn" class="choice-btn blue">Azul</button>
        </div>
        <div id="result-area" class="hidden">
            <h2 id="result-message"></h2>
            <button id="reset-btn">Volver a jugar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
